<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>매일 묵상</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="intro" id="intro" aria-labelledby="intro-title">
        <div class="night-scene" aria-hidden="true">
          <span class="moon"></span>
          <span class="star star-1"></span>
          <span class="star star-2"></span>
          <span class="star star-3"></span>
          <span class="shooting shooting-1"></span>
          <span class="shooting shooting-2"></span>
          <span class="hill hill-back"></span>
          <span class="hill hill-front"></span>
          <span class="tree"></span>
        </div>
        <div class="intro-content">
          <p class="day-label" id="introDay">오늘의 묵상</p>
          <h1 id="intro-title">오늘 하루는<br />잘 보내셨나요?</h1>
          <p class="intro-copy">
            잠깐 멈춰서 오늘의 마음을 돌아보고, 말씀 안에서 하루를 정리해보세요.
          </p>
          <button class="start-button" id="startButton" type="button">
            묵상 시작하기
          </button>
        </div>
      </section>

      <section class="reflection hidden" id="reflection" aria-live="polite">
        <header class="reflection-header">
          <div>
            <p class="day-label" id="devotionDay"></p>
            <h2 id="devotionTitle"></h2>
          </div>
          <label class="date-picker">
            <span>날짜 선택</span>
            <select id="devotionSelect"></select>
          </label>
        </header>

        <section class="music-player" aria-label="배경 음악">
          <div>
            <p class="day-label">기도 반주</p>
            <strong>하루 시작 전 5분 기도반주</strong>
          </div>
          <button class="music-button" id="musicButton" type="button">
            배경 음악 켜기
          </button>
          <audio
            id="backgroundMusic"
            src="assets/background-prayer.m4a"
            preload="auto"
            loop
          ></audio>
          <p class="music-message" id="musicMessage" role="status"></p>
        </section>

        <article class="scripture">
          <p id="scriptureText"></p>
          <span id="scriptureRef"></span>
        </article>

        <article class="content-block">
          <h3>묵상</h3>
          <div id="meditationText"></div>
        </article>

        <aside class="today-line">
          <span>오늘의 한 줄</span>
          <strong id="todayLine"></strong>
        </aside>

        <article class="content-block prayer">
          <h3>기도</h3>
          <p id="prayerText"></p>
        </article>

        <section class="journal" aria-labelledby="journal-title">
          <p class="day-label">오늘의 기록</p>
          <h3 id="journal-title">오늘 하루는 어땠나요?</h3>
          <p>
            마음에 남은 말, 감사했던 일, 하나님께 드리고 싶은 고백을
            편하게 남겨보세요.
          </p>
          <textarea
            id="journalInput"
            placeholder="오늘 내 마음에 남은 것을 적어보세요."
          ></textarea>
          <button class="save-button" id="saveButton" type="button">
            기록 남기기
          </button>
          <p class="save-message" id="saveMessage" role="status"></p>
        </section>

        <section class="journal-history" aria-labelledby="history-title">
          <div class="history-heading">
            <div>
              <p class="day-label">내 기록장</p>
              <h3 id="history-title">날짜별로 남긴 기록</h3>
            </div>
            <button class="clear-button" id="clearCurrentButton" type="button">
              오늘 기록 지우기
            </button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </section>
    </main>

    <script src="data/devotions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
